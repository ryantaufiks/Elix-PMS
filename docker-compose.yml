# Base services shared by dev and prod.
#   Dev  : docker compose up -d --build            (auto-loads docker-compose.override.yml)
#   Prod : ENV_FILE=.env.prod docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Container logs: at most 3 x 10 MB each, so they never fill the disk.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-backend: &backend
  <<: *logging
  build: ./backend
  env_file: ${ENV_FILE:-.env}
  environment:
    MEDIA_ROOT: /data/media
    BACKUP_ROOT: /data/backups
  volumes:
    - media:/data/media
    - backups:/data/backups
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    <<: *logging
    image: postgres:16-alpine
    env_file: ${ENV_FILE:-.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    <<: *logging
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    <<: *backend
    environment:
      MEDIA_ROOT: /data/media
      BACKUP_ROOT: /data/backups
      RUN_MIGRATIONS: "1"

  # One worker that also runs the schedule (-B): a separate beat process would cost ~100 MB for a clock.
  # A worker process that grows past ~300 MB (a big backup) is replaced after its task.
  worker:
    <<: *backend
    command: ["celery", "-A", "myproject", "worker", "-B", "-l", "info", "--concurrency", "2",
              "--schedule", "/tmp/celerybeat-schedule", "--max-memory-per-child", "300000"]

volumes:
  pgdata:
  redisdata:
  media:
  backups:
