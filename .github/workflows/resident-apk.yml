# Builds the resident Android app on GitHub's runners (the production server is too small for Gradle)
# and publishes the APK to the "resident-latest" release.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64      base64 of mobile/resident/android/elix-release.jks (required: updates only
#                                install over earlier versions signed with the same key)
#   ANDROID_KEYSTORE_PASSWORD    store/key password from android/key.properties
#   GOOGLE_SERVICES_JSON_BASE64  optional: base64 of google-services.json (enables push)
# Repository variable: API_BASE (defaults to https://myelix.kurmapos.online)
name: Resident APK

on:
  push:
    branches: [main]
    paths: ["mobile/resident/**", ".github/workflows/resident-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resident-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/resident
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Set ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD. Without the release key, phones cannot update the app."
            exit 1
          fi
          # Tolerate line breaks or spaces picked up when copying the secret.
          if ! printf '%s' "$KEYSTORE" | tr -d ' \r\n\t' | base64 -d > android/elix-release.jks 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Re-create it with: base64 -w0 elix-release.jks"
            exit 1
          fi
          if ! keytool -list -keystore android/elix-release.jks -storepass "$PASSWORD" -alias elix >/dev/null 2>&1; then
            echo "::error::The keystore could not be opened: ANDROID_KEYSTORE_PASSWORD is wrong, or the keystore secret is not elix-release.jks."
            exit 1
          fi
          printf 'storeFile=elix-release.jks\nstorePassword=%s\nkeyAlias=elix\nkeyPassword=%s\n' "$PASSWORD" "$PASSWORD" > android/key.properties

      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            if ! printf '%s' "$GOOGLE_SERVICES" | tr -d ' \r\n\t' | base64 -d > android/app/google-services.json 2>/dev/null \
                || ! python3 -m json.tool android/app/google-services.json >/dev/null; then
              echo "::error::GOOGLE_SERVICES_JSON_BASE64 is not a base64-encoded google-services.json."
              exit 1
            fi
          else
            echo "::notice::No google-services.json: the app rings only while open."
          fi

      - run: flutter pub get
      - run: flutter analyze
      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE=${{ vars.API_BASE || 'https://myelix.kurmapos.online' }} \
            --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk elix-resident.apk

      - uses: actions/upload-artifact@v4
        with:
          name: elix-resident-apk
          path: mobile/resident/elix-resident.apk

      - name: Publish to the resident-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view resident-latest >/dev/null 2>&1 || \
            gh release create resident-latest --title "Resident app (latest)" --notes "Latest Android build of the Elix resident app." --prerelease
          gh release upload resident-latest elix-resident.apk --clobber
