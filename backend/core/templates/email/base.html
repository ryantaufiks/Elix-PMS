<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ brand }}</title></head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0f172a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e2e8f0;">
        <tr><td style="background:#0b1631;padding:22px 28px;color:#ffffff;font-size:20px;font-weight:700;letter-spacing:3px;">ELIX</td></tr>
        <tr><td style="padding:28px;font-size:15px;line-height:1.6;">{% block content %}{% endblock %}</td></tr>
        <tr><td style="padding:16px 28px;border-top:1px solid #e2e8f0;font-size:12px;line-height:1.5;color:#64748b;">
          {% block footer %}Sent by {{ brand }}. Supported by Smart City Technologies Pte Ltd.{% endblock %}
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
