# Gateway: serves the dashboard (static Next.js export) and proxies the API, WebSockets, admin
# and Django static files to the `web` service. TLS is terminated in front of this
# (Cloudflare Tunnel), which sets X-Forwarded-Proto.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

# A visitor who typed http:// through Cloudflare: send them to https:// (local calls carry no CF header).
map "$http_cf_connecting_ip|$http_x_forwarded_proto" $plain_http {
    default        0;
    "~^[^|]+\|http$" 1;
}

# Paths only, never query strings: the WebSocket carries the sign-in token in ?token=.
log_format noquery '$client_ip - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                   '$request_time "$http_user_agent"';

server {
    listen 80 default_server;
    access_log /var/log/nginx/access.log noquery;
    server_tokens off;
    client_max_body_size 10m;

    if ($plain_http) {
        return 301 https://$host$request_uri;
    }

    # Re-resolve `web` so a restarted container is found again without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django http://web:8000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # Media (face photos, LPR snapshots) is personal data: only served through authenticated API views.
    location /media/ {
        return 404;
    }

    location /ws/ {
        proxy_pass $django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location ~ ^/(v1|static)/ {
        proxy_pass $django;
        proxy_read_timeout 60s;
    }

    # --- Dashboard ---
    root /usr/share/nginx/html;
    error_page 404 /404.html;

    # Security headers for dashboard pages only (Django sets its own on proxied responses).
    # add_header is not inherited into a location that has its own, hence the repetition below.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Face recognition models for the kiosk (about 12 MB, loaded once and cached by the kiosk browser).
    location /models/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location /downloads/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        types { application/vnd.android.package-archive apk; application/json json; }
        try_files $uri =404;
    }

    # Visitor pass links (/i/<token>) all render the same static page.
    location /i/ {
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; script-src-attr 'none'; object-src 'none'; img-src 'self' blob: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files /i/index.html =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; object-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/index.html =404;
    }
}
