# Gateway: serves the dashboard (static Next.js export) and proxies the API, WebSockets, admin
# and Django static files to the `web` service. TLS is terminated in front of this
# (Cloudflare Tunnel), which sets X-Forwarded-Proto.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

server {
    listen 80 default_server;
    server_tokens off;
    client_max_body_size 10m;

    # Re-resolve `web` so a restarted container is found again without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django http://web:8000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # Media (face photos, LPR snapshots) is personal data: only served through authenticated API views.
    location /media/ {
        return 404;
    }

    location /ws/ {
        proxy_pass $django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location ~ ^/(v1|static)/ {
        proxy_pass $django;
        proxy_read_timeout 60s;
    }

    # --- Dashboard ---
    root /usr/share/nginx/html;
    error_page 404 /404.html;

    # Security headers for dashboard pages only (Django sets its own on proxied responses).
    # add_header is not inherited into a location that has its own, hence the repetition below.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /downloads/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        types { application/vnd.android.package-archive apk; }
        try_files $uri =404;
    }

    # Visitor pass links (/i/<token>) all render the same static page.
    location /i/ {
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
        try_files /i/index.html =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/index.html =404;
    }
}
