# Production overrides. Separate project name => separate database/volumes from dev.
# The API listens on 127.0.0.1:${PROD_PORT:-8000} only and is published through Cloudflare Tunnel
# (public hostname -> http://localhost:8000), so no inbound ports are opened.
# Without Cloudflare, add `--profile nginx` to also run nginx with your own certs on 80/443.
name: elix-vms-prod

services:
  web:
    environment:
      MEDIA_ROOT: /data/media
      RUN_MIGRATIONS: "1"
      DJANGO_COLLECTSTATIC: "1"
    ports:
      - "127.0.0.1:${PROD_PORT:-8000}:8000"

  nginx:
    image: nginx:1.27-alpine
    profiles: ["nginx"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
    restart: unless-stopped
