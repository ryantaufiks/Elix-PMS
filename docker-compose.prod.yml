# Production overrides. Separate project name => separate database/volumes from dev.
name: elix-vms-prod

services:
  web:
    environment:
      MEDIA_ROOT: /data/media
      RUN_MIGRATIONS: "1"
      DJANGO_COLLECTSTATIC: "1"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
    restart: unless-stopped
