name: elix_resident
description: "Elix resident app: answer the gate intercom, swipe to open, invite visitors."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: 4.15.2
  firebase_messaging: 16.7.1
  flutter_callkit_incoming: 3.1.6
  flutter_secure_storage: 11.2.0
  http: 1.6.0
  intl: 0.20.3
  livekit_client: 2.13.1
  permission_handler: 12.0.3
  share_plus: 13.3.1
  vibration: 3.2.1
  web_socket_channel: 3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
