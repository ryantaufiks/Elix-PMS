# Development overrides (loaded automatically by `docker compose`).
# The API listens on DEV_BIND:DEV_PORT (default 127.0.0.1:8001; prod owns 8000); set DEV_BIND to this server's
# Tailscale IP in .env to reach it from your laptop without exposing it publicly.
name: elix-vms-dev

services:
  web:
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    user: root
    volumes:
      - ./backend:/app
      - media:/data/media
    ports:
      - "${DEV_BIND:-127.0.0.1}:${DEV_PORT:-8001}:8000"

  worker:
    volumes:
      - ./backend:/app
      - media:/data/media

  beat:
    volumes:
      - ./backend:/app
      - media:/data/media
